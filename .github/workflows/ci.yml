name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheapest and most structural gate first: fail fast on a boundary
      # violation before spending time on typecheck/lint/test/build.
      - name: Check dependency boundaries
        run: pnpm check:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `pnpm test` depends on `dist/` existing (see `pretest`), which
      # requires the typecheck step above to have already run.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # TODO(006 §23): domain tests, API tests, numerical regression suite —
      # owned by T-039. These are picked up automatically by `pnpm test`
      # (Vitest projects) once the packages that need them exist; no
      # workflow change is required to add them.

  e2e:
    name: Playwright E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
